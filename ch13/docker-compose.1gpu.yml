# 13-4 — 24GB GPU 한 장에 세 컨테이너를 함께 올림 (docker-compose.yml에 덧씌움)
# 실행: docker compose -f docker-compose.yml -f docker-compose.1gpu.yml up -d --build
#   PaddleOCR-VL 20% + Qwen 65% + 나머지는 엔진의 PaddleOCR
#   두 vLLM이 동시에 메모리를 재면 실패하므로 Qwen은 PaddleOCR-VL이 준비된 뒤에 시작
#   Qwen3.5의 선형 어텐션 캐시가 기본 동시 요청 수(256)를 담지 못해 32로 줄임
services:
  vl:
    command: >-
      PaddlePaddle/PaddleOCR-VL-1.6 --served-model-name PaddleOCR-VL-1.6-0.9B
      --gpu-memory-utilization 0.2 --max-model-len 16384
  llm:
    command: >-
      Qwen/Qwen3.5-9B --quantization fp8 --gpu-memory-utilization 0.65 --max-model-len 16384 --max-num-seqs 32
    deploy: {resources: {reservations: {devices: !override [{driver: nvidia, capabilities: [gpu], device_ids: ["0"]}]}}}
    depends_on:
      vl: {condition: service_healthy}
